<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infonazionale - L.U.X. Gruppo SLL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #9ca3af;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #10b981;
    }
    .btn-search {
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-search:hover {
      background: #059669;
    }
    .result-area {
      margin-top: 20px;
      padding: 16px;
      background: #1f2937;
      border-radius: 12px;
      color: #d1d5db;
      font-size: 0.95rem;
      display: none;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">L.U.X. Gruppo SLL</div>
    <h1>Infonazionale</h1>
    <p>Motore di ricerca AI per la scuola. Poni una domanda e ottieni una risposta chiara e dettagliata.</p>

    <div class="search-box">
      <input type="text" id="query-input" placeholder="Chiedi qualsiasi cosa per la scuola...">
      <button class="btn-search" onclick="handleSearch()">Cerca</button>
    </div>

    <div id="result-box" class="result-area"></div>
  </div>

  <script>
    function handleSearch() {
      const q = document.getElementById('query-input').value.trim();
      const res = document.getElementById('result-box');
      if (!q) return;
      res.style.display = 'block';
      res.innerHTML = `<strong>Risposta AI:</strong> Generazione della risposta per "<em>${q}</em>" in corso...`;
    }
  </script>

  <!-- SYSTEM CONTROL L.U.X. HQ - CONTROLLO STATO -->
  <script>
  (function() {
    const CURRENT_SITE_ID = "infonazionale";
    const HQ_API_URL = "https://luxheadquarters.vercel.app/api/projects";

    const STATUS_CONFIG = {
      "in_lavorazione": {
        emoji: "🟡",
        title: "Sito in Lavorazione",
        message: "Questo servizio è attualmente in fase di sviluppo da parte del team L.U.X."
      },
      "in_manutenzione": {
        emoji: "🟠",
        title: "In Manutenzione",
        message: "Il sito è temporaneamente offline per interventi di manutenzione programmata."
      },
      "in_aggiornamento": {
        emoji: "🔵",
        title: "Aggiornamento in Corso",
        message: "Stiamo applicando importanti aggiornamenti di sistema per migliorare l'esperienza."
      }
    };

    async function checkSiteStatus() {
      try {
        const response = await fetch(`${HQ_API_URL}?t=${Date.now()}`);
        if (!response.ok) return;

        const projects = await response.json();
        const mySite = projects.find(p => p.id === CURRENT_SITE_ID);

        if (mySite && mySite.status && mySite.status !== 'attivo') {
          const config = STATUS_CONFIG[mySite.status] || {
            emoji: "🔴",
            title: "Servizio Disattivato",
            message: "Il servizio è temporaneamente non disponibile."
          };
          renderOfflineOverlay(mySite.name, config);
        }
      } catch (err) {
        console.warn("Impossibile verificare lo stato con l'HQ L.U.X.:", err);
      }
    }

    function renderOfflineOverlay(siteName, config) {
      if (document.getElementById('lux-status-modal')) return;

      const overlay = document.createElement('div');
      overlay.id = 'lux-status-modal';
      overlay.style.cssText = `
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background-color: rgba(10, 10, 12, 0.96);
        backdrop-filter: blur(12px);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
        padding: 20px;
        box-sizing: border-box;
      `;

      overlay.innerHTML = `
        <div style="
          background: #18181c;
          border: 1px solid #2e2e38;
          border-radius: 20px;
          padding: 36px 28px;
          max-width: 440px;
          width: 100%;
          text-align: center;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        ">
          <div style="font-size: 52px; margin-bottom: 16px;">${config.emoji}</div>
          <h2 style="margin: 0 0 10px 0; font-size: 1.6rem; font-weight: 700; color: #ffffff;">${config.title}</h2>
          <p style="color: #a1a1aa; line-height: 1.5; margin: 0 0 24px 0; font-size: 0.95rem;">
            <strong>${siteName}</strong>: ${config.message}
          </p>
          <a href="https://luxheadquarters.vercel.app" style="
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            box-sizing: border-box;
            transition: background 0.2s ease;
          " onmouseover="this.style.background='#2563eb'" onmouseout="this.style.background='#3b82f6'">
            Vai al Quartier Generale ↗
          </a>
        </div>
      `;

      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
    }

    checkSiteStatus();
  })();
  </script>
</body>
</html>
